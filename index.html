<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل حارتنا</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --green: #176b45;
  --dark: #0d4938;
  --light: #eaf5ef;
  --gold: #e0a52b;
  --red: #c62828;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f8f5;
  color: #193329;
  font-family: Cairo, Arial, sans-serif;
}

header {
  background: linear-gradient(140deg, var(--dark), var(--green));
  color: white;
  text-align: center;
  padding: 24px 16px 30px;
  border-radius: 0 0 28px 28px;
}

.logo {
  width: 88px;
  height: 88px;
  display: block;
  margin: auto;
}

.brand {
  font-size: 27px;
  font-weight: 800;
  margin: 8px 0;
}

header p {
  margin: 5px;
  color: #d5f4e3;
}

main {
  max-width: 760px;
  margin: 18px auto;
  padding: 0 14px;
}

.welcome {
  background: white;
  border-radius: 16px;
  padding: 14px;
  text-align: center;
  margin-bottom: 15px;
  box-shadow: 0 4px 18px #0d493810;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.tile {
  background: white;
  border: 1px solid #e0ece4;
  border-radius: 17px;
  padding: 18px 12px;
  text-align: center;
  cursor: pointer;
  font-family: inherit;
  color: var(--dark);
  box-shadow: 0 4px 14px #0d493808;
}

.tile .icon {
  font-size: 32px;
  display: block;
}

.tile h3 {
  margin: 7px 0 2px;
  font-size: 16px;
}

.tile p {
  margin: 0;
  color: #698076;
  font-size: 12px;
}

.panel {
  display: none;
  background: white;
  border-radius: 18px;
  padding: 16px;
  margin-top: 15px;
  box-shadow: 0 4px 18px #0d493810;
}

.panel h2 {
  margin: 0 0 12px;
  color: var(--dark);
  font-size: 21px;
}

.item {
  border: 1px solid #e5eee8;
  border-radius: 12px;
  padding: 12px;
  margin: 9px 0;
}

.item b {
  display: block;
  color: var(--dark);
}

.item small {
  color: #708077;
}

.call {
  display: inline-block;
  background: var(--green);
  color: white;
  text-decoration: none;
  border-radius: 9px;
  padding: 7px 12px;
  margin-top: 8px;
  font-size: 13px;
}

.back {
  border: 0;
  background: var(--light);
  color: var(--green);
  padding: 8px 14px;
  border-radius: 9px;
  font-family: inherit;
  cursor: pointer;
  margin-bottom: 12px;
}

footer {
  text-align: center;
  color: #718178;
  font-size: 13px;
  padding: 25px 12px 30px;
}

footer a {
  color: var(--green);
  font-weight: 800;
  text-decoration: none;
}

@media (min-width: 560px) {
  .grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
</style>
</head>

<body>

<header>

<svg class="logo" viewBox="0 0 100 100" aria-label="شعار دليل حارتنا">
  <path d="M50 4 88 22v29c0 23-17 39-38 45C29 90 12 74 12 51V22Z" fill="#fff"/>
  <path d="M50 12 80 26v25c0 18-13 31-30 37-17-6-30-19-30-37V26Z" fill="#176b45"/>
  <path d="M26 55 43 39l13 11 18-18 12 11v23H26Z" fill="#fff"/>
  <path d="M50 23v21M40 33h20" stroke="#e0a52b" stroke-width="7" stroke-linecap="round"/>
</svg>

<h1 class="brand">دليل حارتنا</h1>

<p>لأن راحتكم وأمانكم بيهمّونا</p>

<p>غرب المشتل • التتان • عين اللوزة</p>

</header>

<main>

<div class="welcome">
  خدمات الحي ومعلوماته… بين إيديكم 💚
</div>

<div class="grid" id="home">

<button class="tile" onclick="showSection('pharmacies')">
  <span class="icon">💊</span>
  <h3>صيدليات المناوبة</h3>
  <p>صيدلية اليوم ومعلوماتها</p>
</button>

<button class="tile" onclick="showSection('doctors')">
  <span class="icon">🩺</span>
  <h3>أرقام الأطباء</h3>
  <p>اختصاصات وأرقام التواصل</p>
</button>

<button class="tile" onclick="showSection('services')">
  <span class="icon">🛠️</span>
  <h3>خدمات الحي</h3>
  <p>كهربجي، دهان، حداد، صحية</p>
</button>

<button class="tile" onclick="showSection('emergency')">
  <span class="icon">☎️</span>
  <h3>أرقام هامة</h3>
  <p>طوارئ وخدمات عامة</p>
</button>

</div>

<section class="panel" id="panel">

<button class="back" onclick="goHome()">← رجوع</button>

<h2 id="sectionTitle"></h2>

<div id="items">
  جاري تحميل المعلومات...
</div>

</section>

</main>

<footer>
  للتواصل مع مصمم الموقع:
  <a href="tel:0937966022">علي العبيد — 0937966022</a>
  <br>
  دليل حارتنا • لخدمة أهل المنطقة
</footer>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDLeSSYAXRlZ9TtUT03Vs1OJjA-VcOzon0",
  authDomain: "dalil-hartna.firebaseapp.com",
  projectId: "dalil-hartna",
  storageBucket: "dalil-hartna.firebasestorage.app",
  messagingSenderId: "889716737271",
  appId: "1:889716737271:web:c35b9592408d255b64fff2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const sectionNames = {
  pharmacies: "صيدليات المناوبة",
  doctors: "أرقام الأطباء",
  services: "خدمات الحي",
  emergency: "أرقام هامة"
};

let unsubscribe = null;

window.showSection = function(section) {

  document.getElementById("home").style.display = "none";

  document.getElementById("panel").style.display = "block";

  document.getElementById("sectionTitle").textContent =
    sectionNames[section];

  document.getElementById("items").textContent =
    "جاري تحميل المعلومات...";

  if (unsubscribe) {
    unsubscribe();
  }

  unsubscribe = onSnapshot(
    collection(db, section),

    function(snapshot) {

      const records = snapshot.docs.map(doc => doc.data());

      if (records.length === 0) {
        document.getElementById("items").innerHTML =
          "لا توجد معلومات مضافة حالياً.";
        return;
      }

      document.getElementById("items").innerHTML =
        records.map(function(record) {

          const phone = record.phone || "";

          return `
            <article class="item">

              <b>${escapeHTML(record.name)}</b>

              <small>${escapeHTML(record.details || "")}</small>

              ${
                phone
                ? `
                  <br>
                  <a class="call"
                     href="tel:${escapeHTML(phone.replace(/[^0-9+]/g, ""))}">
                    اتصال: ${escapeHTML(phone)}
                  </a>
                `
                : ""
              }

            </article>
          `;

        }).join("");

    },

    function(error) {

      document.getElementById("items").textContent =
        "تعذر تحميل المعلومات. يرجى المحاولة لاحقاً.";

      console.error(error);

    }
  );

};

window.goHome = function() {

  if (unsubscribe) {
    unsubscribe();
    unsubscribe = null;
  }

  document.getElementById("home").style.display = "grid";

  document.getElementById("panel").style.display = "none";

};

function escapeHTML(value) {

  return String(value || "").replace(/[&<>"']/g, function(char) {

    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];

  });

}

</script>

</body>
</html>
