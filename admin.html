<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة دليل حارتنا</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --green: #176b45;
  --dark: #0d4938;
  --light: #eaf5ef;
  --red: #b3261e;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f7f4;
  color: #193329;
  font-family: Cairo, Arial, sans-serif;
}

.wrap {
  max-width: 760px;
  margin: 22px auto;
  padding: 14px;
}

.card {
  background: white;
  border-radius: 17px;
  padding: 18px;
  box-shadow: 0 4px 18px #1232;
  margin-bottom: 14px;
}

h1, h2 {
  color: var(--dark);
  margin-top: 0;
}

input, select, button {
  font: inherit;
  width: 100%;
  padding: 11px;
  border-radius: 10px;
  border: 1px solid #d5e3d9;
  margin: 6px 0;
}

button {
  background: var(--green);
  color: white;
  border: 0;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.danger {
  background: var(--red);
}

.secondary {
  background: var(--light);
  color: var(--green);
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.entry {
  border: 1px solid #e1ebe4;
  border-radius: 12px;
  padding: 12px;
  margin: 8px 0;
  overflow-wrap: anywhere;
}

.entry b {
  display: block;
  color: var(--dark);
}

.entry .buttons {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.entry .buttons button {
  width: auto;
  flex: 1;
  padding: 7px;
}

.hint {
  font-size: 13px;
  color: #6c7e73;
}

.status {
  font-size: 14px;
  margin-top: 8px;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div class="wrap">

<section class="card" id="loginCard">

  <h1>لوحة إدارة دليل حارتنا</h1>

  <p class="hint">
    تسجيل الدخول لحساب الإدارة المصرّح فقط.
  </p>

  <input
    id="email"
    type="email"
    placeholder="البريد الإلكتروني"
    autocomplete="username"
  >

  <input
    id="password"
    type="password"
    placeholder="كلمة المرور"
    autocomplete="current-password"
  >

  <button id="loginButton">
    تسجيل الدخول
  </button>

  <p id="loginMessage" class="status"></p>

</section>


<div id="adminApp" class="hidden">

  <section class="card">

    <h1>إدارة دليل حارتنا</h1>

    <p class="hint">
      أضف أو عدّل المعلومات، وستظهر عند الزوار مباشرة.
    </p>

    <div class="row">

      <select id="sectionSelect">

        <option value="pharmacies">
          صيدليات المناوبة
        </option>

        <option value="doctors">
          أرقام الأطباء
        </option>

        <option value="services">
          خدمات الحي
        </option>

        <option value="emergency">
          أرقام هامة
        </option>

      </select>

      <button id="logoutButton" class="secondary">
        تسجيل خروج
      </button>

    </div>

    <h2 id="formTitle">
      إضافة معلومة
    </h2>

    <input
      id="nameInput"
      type="text"
      placeholder="الاسم أو عنوان الخدمة"
    >

    <input
      id="detailsInput"
      type="text"
      placeholder="الاختصاص أو العنوان أو التفاصيل"
    >

    <input
      id="phoneInput"
      type="tel"
      placeholder="رقم الهاتف"
    >

    <div class="row">

      <button id="saveButton">
        حفظ المعلومة
      </button>

      <button id="cancelButton" class="secondary hidden">
        إلغاء التعديل
      </button>

    </div>

    <p id="formMessage" class="status"></p>

  </section>


  <section class="card">

    <h2>المعلومات الحالية</h2>

    <div id="recordsList">
      جاري تحميل المعلومات...
    </div>

  </section>

</div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  doc,
  updateDoc,
  deleteDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";


/* إعدادات Firebase */

const firebaseConfig = {
  apiKey: "AIzaSyDLeSSYAXRlZ9TtUT03Vs1OJjA-VcOzon0",
  authDomain: "dalil-hartna.firebaseapp.com",
  projectId: "dalil-hartna",
  storageBucket: "dalil-hartna.firebasestorage.app",
  messagingSenderId: "889716737271",
  appId: "1:889716737271:web:c35b9592408d255b64fff2"
};


/* حساب الإدارة المصرّح */

const ADMIN_UID = "h00FrvjU6QODSFJ3ZZlGa1otzC62";


/* تهيئة Firebase */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* عناصر الصفحة */

const loginCard = document.getElementById("loginCard");

const adminApp = document.getElementById("adminApp");

const emailInput = document.getElementById("email");

const passwordInput = document.getElementById("password");

const loginButton = document.getElementById("loginButton");

const logoutButton = document.getElementById("logoutButton");

const loginMessage = document.getElementById("loginMessage");

const sectionSelect = document.getElementById("sectionSelect");

const nameInput = document.getElementById("nameInput");

const detailsInput = document.getElementById("detailsInput");

const phoneInput = document.getElementById("phoneInput");

const saveButton = document.getElementById("saveButton");

const cancelButton = document.getElementById("cancelButton");

const formTitle = document.getElementById("formTitle");

const formMessage = document.getElementById("formMessage");

const recordsList = document.getElementById("recordsList");


/* متغيرات */

let unsubscribe = null;

let editingId = null;


/* تسجيل الدخول */

loginButton.addEventListener("click", async function() {

  const email = emailInput.value.trim();

  const password = passwordInput.value;

  if (!email || !password) {

    loginMessage.textContent =
      "أدخل البريد الإلكتروني وكلمة المرور.";

    return;

  }

  loginButton.disabled = true;

  loginMessage.textContent =
    "جاري تسجيل الدخول...";

  try {

    const result = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    if (result.user.uid !== ADMIN_UID) {

      await signOut(auth);

      loginMessage.textContent =
        "هذا الحساب غير مخوّل لإدارة الموقع.";

      return;

    }

    loginMessage.textContent =
      "تم تسجيل الدخول بنجاح.";

  } catch (error) {

    loginMessage.textContent =
      "تعذر تسجيل الدخول. تحقق من البريد وكلمة المرور.";

    console.error(error);

  } finally {

    loginButton.disabled = false;

  }

});


/* التحقق من الحساب */

onAuthStateChanged(auth, function(user) {

  if (user && user.uid === ADMIN_UID) {

    loginCard.classList.add("hidden");

    adminApp.classList.remove("hidden");

    loadRecords();

  } else {

    loginCard.classList.remove("hidden");

    adminApp.classList.add("hidden");

    if (user) {

      signOut(auth);

    }

  }

});


/* تسجيل الخروج */

logoutButton.addEventListener("click", async function() {

  if (unsubscribe) {

    unsubscribe();

    unsubscribe = null;

  }

  await signOut(auth);

  resetForm();

});


/* تغيير القسم */

sectionSelect.addEventListener("change", function() {

  resetForm();

  loadRecords();

});


/* تحميل المعلومات */

function loadRecords() {

  if (unsubscribe) {

    unsubscribe();

  }

  const section = sectionSelect.value;

  recordsList.textContent =
    "جاري تحميل المعلومات...";

  unsubscribe = onSnapshot(
    collection(db, section),

    function(snapshot) {

      if (snapshot.empty) {

        recordsList.textContent =
          "لا توجد معلومات مضافة في هذا القسم.";

        return;

      }

      recordsList.innerHTML = "";

      snapshot.forEach(function(documentSnapshot) {

        const data = documentSnapshot.data();

        const item = document.createElement("div");

        item.className = "entry";

        const title = document.createElement("b");

        title.textContent = data.name || "";

        const details = document.createElement("div");

        details.textContent =
          (data.details || "") +
          (data.phone ? " — " + data.phone : "");

        const buttons = document.createElement("div");

        buttons.className = "buttons";

        const editButton = document.createElement("button");

        editButton.textContent = "تعديل";

        editButton.addEventListener("click", function() {

          editRecord(documentSnapshot.id, data);

        });

        const deleteButton = document.createElement("button");

        deleteButton.textContent = "حذف";

        deleteButton.className = "danger";

        deleteButton.addEventListener("click", function() {

          deleteRecord(documentSnapshot.id);

        });

        buttons.append(editButton, deleteButton);

        item.append(title, details, buttons);

        recordsList.appendChild(item);

      });

    },

    function(error) {

      recordsList.textContent =
        "تعذر تحميل البيانات. تحقق من قواعد Firestore.";

      console.error(error);

    }
  );

}


/* إضافة أو تعديل */

saveButton.addEventListener("click", async function() {

  const name = nameInput.value.trim();

  const details = detailsInput.value.trim();

  const phone = phoneInput.value.trim();

  if (!name) {

    formMessage.textContent =
      "يرجى كتابة الاسم أولاً.";

    return;

  }

  const section = sectionSelect.value;

  const record = {
    name: name,
    details: details,
    phone: phone,
    updatedAt: new Date().toISOString()
  };

  saveButton.disabled = true;

  formMessage.textContent =
    "جاري حفظ المعلومات...";

  try {

    if (editingId) {

      await updateDoc(
        doc(db, section, editingId),
        record
      );

      formMessage.textContent =
        "تم تعديل المعلومة بنجاح.";

    } else {

      await addDoc(
        collection(db, section),
        record
      );

      formMessage.textContent =
        "تمت إضافة المعلومة بنجاح.";

    }

    resetForm();

  } catch (error) {

    formMessage.textContent =
      "فشل الحفظ. تحقق من صلاحيات Firestore.";

    console.error(error);

  } finally {

    saveButton.disabled = false;

  }

});


/* تعديل سجل */

function editRecord(id, data) {

  editingId = id;

  nameInput.value = data.name || "";

  detailsInput.value = data.details || "";

  phoneInput.value = data.phone || "";

  formTitle.textContent =
    "تعديل المعلومة";

  saveButton.textContent =
    "حفظ التعديل";

  cancelButton.classList.remove("hidden");

  formMessage.textContent =
    "أنت تعدّل معلومة موجودة.";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* حذف سجل */

async function deleteRecord(id) {

  const confirmed = confirm(
    "هل أنت متأكد من حذف هذه المعلومة؟"
  );

  if (!confirmed) {

    return;

  }

  try {

    await deleteDoc(
      doc(db, sectionSelect.value, id)
    );

    formMessage.textContent =
      "تم حذف المعلومة.";

  } catch (error) {

    formMessage.textContent =
      "تعذر الحذف. تحقق من صلاحيات Firestore.";

    console.error(error);

  }

}


/* إلغاء التعديل */

cancelButton.addEventListener("click", resetForm);


/* إعادة النموذج */

function resetForm() {

  editingId = null;

  nameInput.value = "";

  detailsInput.value = "";

  phoneInput.value = "";

  formTitle.textContent =
    "إضافة معلومة";

  saveButton.textContent =
    "حفظ المعلومة";

  cancelButton.classList.add("hidden");

  formMessage.textContent = "";

}

</script>

</body>
</html>
